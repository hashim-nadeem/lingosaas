name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The integration suite asserts tenant isolation and the schema's
    # constraints against a real database, so one is provisioned here rather
    # than mocked — a mocked constraint proves nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lingosaas
          POSTGRES_PASSWORD: lingosaas
          POSTGRES_DB: lingosaas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingosaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lingosaas:lingosaas@localhost:5432/lingosaas?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-any-deployment
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
